<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141a45" />
    <title>Mafia: offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1030; color: #f4f1ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 0; font-size: 1.6rem; }
      p { margin: 0; max-width: 32ch; color: #c9c6e6; line-height: 1.5; }
      button { font: inherit; font-weight: 700; padding: 12px 22px; min-height: 44px; border-radius: 12px; border: 0; background: #f2c94c; color: #1a1430; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>Mafia is played live with other people, so it needs the internet. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
